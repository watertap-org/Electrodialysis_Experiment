<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="5" refX="6.5" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#1f2937"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #1f2937; stroke-width: 2; rx: 8; ry: 8; }
      .ed { fill: #ecfeff; stroke: #0f766e; stroke-width: 2; rx: 8; ry: 8; }
      .txt { font-family: Arial, sans-serif; font-size: 18px; fill: #111827; }
      .small { font-family: Arial, sans-serif; font-size: 14px; fill: #374151; }
      .line { stroke: #1f2937; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #0f172a; }
    </style>
  </defs>

  <text x="30" y="40" class="title">One-Stage Single-Pass Electrodialysis (demo_ossp_proc.py)</text>

  <rect class="box" x="40" y="170" width="130" height="70"/>
  <text class="txt" x="88" y="212">Feed</text>

  <rect class="box" x="240" y="170" width="150" height="70"/>
  <text class="txt" x="274" y="212">Separator</text>

  <rect class="box" x="470" y="90" width="140" height="70"/>
  <text class="txt" x="509" y="132">Pump 1</text>
  <text class="small" x="476" y="154">Concentrate side</text>

  <rect class="box" x="470" y="250" width="140" height="70"/>
  <text class="txt" x="509" y="292">Pump 0</text>
  <text class="small" x="494" y="314">Diluate side</text>

  <rect class="ed" x="700" y="120" width="230" height="170"/>
  <text class="txt" x="765" y="170">ED Stack</text>
  <text class="small" x="738" y="195">Concentrate channel</text>
  <text class="small" x="761" y="232">Diluate channel</text>

  <rect class="box" x="1010" y="260" width="150" height="70"/>
  <text class="txt" x="1042" y="302">Product</text>
  <text class="small" x="1030" y="324">Diluate outlet</text>

  <rect class="box" x="1010" y="80" width="150" height="70"/>
  <text class="txt" x="1038" y="122">Disposal</text>
  <text class="small" x="1018" y="144">Concentrate outlet</text>

  <path class="line" d="M170 205 L240 205"/>
  <path class="line" d="M390 205 L470 125"/>
  <path class="line" d="M390 205 L470 285"/>
  <path class="line" d="M610 125 L700 155"/>
  <path class="line" d="M610 285 L700 255"/>
  <path class="line" d="M930 155 L1010 115"/>
  <path class="line" d="M930 255 L1010 295"/>

</svg>
