[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "electrodialysis_experiment"
version = "0.1.0"
description = "Experiments, models, and analysis for electrodialysis research."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Xiangyu Bi", email = "xbi@lbl.gov" }
]
requires-python = ">=3.9"

# ---- Runtime dependencies ----
dependencies = [
  "idaes-pse>=2.6",
  "Pyomo>=6.8",
  "numpy>=1.25",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "Pint>=0.24",
  "h5py>=3.9",
  "pyarrow>=12",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "plotly>=5.15",
  "tables>=3.8",
  "PyYAML>=6.0",
  "watertap>=1.2.0",
  "pydantic>=2.9",
  "IPython>=8.15",
]

# Optional dependency groups
[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "black>=24.3",
  "isort>=5.13",
  "pylint>=2.17",
  "mypy>=1.7",
  "pre-commit>=3.7",
  "jupyter>=1.0",
  "nbmake>=1.5",
]
docs = [
  "Sphinx>=7.1",
  "sphinx-rtd-theme>=2.0",
  "nbsphinx>=0.9",
]

# ---- Setuptools (src/ layout, package discovery, data files) ----
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true
package-dir = { "" = "src" }

# Include non-code files in the package
[tool.setuptools.package-data]
electrodialysis_experiment = [
  "**/*.yaml", "**/*.yml",
  "**/*.csv", "**/*.parquet",
  "**/*.h5", "**/*.hdf5"
]

