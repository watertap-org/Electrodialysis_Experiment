          value: 2.16e-14
        - index: ["aem"]
          value: 1.75e-14

    - indexedVar: fs.EDstack[2].unit.membrane_areal_resistance_const
      items:
        - index: ["cem"]
          value: 1.0e-3
        - index: ["aem"]
          value: 2.2e-3

    - indexedVar: fs.EDstack[2].unit.membrane_areal_resistance_coef
      items:
        - index: ["cem"]
          value: 0.03
        - index: ["aem"]
          value: 0.03

    - indexedVar: fs.EDstack[2].unit.membrane_thickness
      items:
        - index: ["aem"]
          value: 6.35e-4
        - index: ["cem"]
          value: 5.7e-4

    - indexedVar: fs.EDstack[2].unit.ion_trans_number_membrane
      items:
        - index: ["cem", "Na_+"]
          value: 0.916
        - index: ["aem", "Na_+"]
          value: 0
        - index: ["cem", "Ca_2+"]
          value: 0.024
        - index: ["aem", "Ca_2+"]
          value: 0
        - index: ["cem", "Mg_2+"]
          value: 0.059
        - index: ["aem", "Mg_2+"]
          value: 0
        - index: ["cem", "Cl_-"]
          value: 0
        - index: ["aem", "Cl_-"]
          value: 1

    - indexedVar: fs.EDstack[2].unit.solute_diffusivity_membrane
      items:
        - index: ["cem", "Na_+"]
